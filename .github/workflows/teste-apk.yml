# Abre o APK de um release já publicado num emulador Android e confere se o app não fecha na
# abertura. O workflow do release já faz esse teste antes de publicar; este serve para conferir
# depois, à mão (Actions → "Teste do APK" → Run workflow), ou um release criado pela página.
name: Teste do APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release a testar (vazio = o mais recente)'
        required: false

permissions:
  contents: read

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Baixar o APK do release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern '*.apk' --output app.apk
          else
            gh release download --pattern '*.apk' --output app.apk
          fi
          ls -la app.apk

      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Imagem x86_64 com tradução ARM (o APK é arm64-v8a e armeabi-v7a).
      - name: Abrir o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/abrir-apk.sh

      - name: Guardar o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-do-emulador
          path: |
            logcat.txt
            erro.txt
            instalar.txt
            tela.png
          if-no-files-found: ignore
