# Gera o APK de Android e publica no release do GitHub a cada tag de versão (v0.1.0, v0.2.0...).
# Também dá para rodar à mão em Actions → "Release Android (APK)" → Run workflow, informando a tag.
#
# O APK usa a API simulada (os dados do modelo de ML, sem servidor). Para o Google Maps,
# cadastre o segredo GOOGLE_MAPS_API_KEY em Settings → Secrets and variables → Actions;
# sem ele, o mapa aparece esquemático.
name: Release Android (APK)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release, por exemplo v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Conferir (typecheck e testes)
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Gerar o projeto Android (CNG)
        run: npx expo prebuild --platform android --no-install
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Nomear o APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "garupa-sp-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk app.apk

      # Só publica se o app abrir no emulador e continuar aberto (o 0.1.0 fechava na abertura).
      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/abrir-apk.sh

      - name: Guardar o log do emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-do-emulador
          path: |
            logcat.txt
            erro.txt
            instalar.txt
            tela.png
          if-no-files-found: ignore

      - name: Publicar no release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Garupa SP ${{ env.TAG }} (Android)
          body_path: .github/notas-do-release.md
          files: garupa-sp-${{ env.TAG }}.apk
          fail_on_unmatched_files: true
