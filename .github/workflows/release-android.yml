# Gera o APK de Android, abre num emulador e, numa tag de versão (v0.1.0, v0.2.0...), publica
# no release do GitHub. A cada push na main, só compila e testa (o APK fica nos artefatos do run).
# Também dá para rodar à mão em Actions → "Release Android (APK)" → Run workflow, informando a tag.
#
# O APK fala com a API de produção (C#, no Railway): cadastro, login, plano do turno, SOS,
# relatos e pulseira. Para o Google Maps,
# cadastre o segredo GOOGLE_MAPS_API_KEY em Settings → Secrets and variables → Actions;
# sem ele, as telas avisam que o mapa do Google não está ativado (não há mapa simulado).
name: Release Android (APK)

on:
  push:
    tags: ['v*']
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release, por exemplo v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Em todos os passos: o prebuild põe a chave no Android e o Gradle lê o app.config.js de
      # novo para o JavaScript (expo-constants). Só no prebuild, o app achava que não havia chave.
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      # API de produção (endereço público, não é segredo). Entram no JavaScript na hora do build.
      EXPO_PUBLIC_API_MODE: http
      EXPO_PUBLIC_API_URL: https://garupa-sp-api-production.up.railway.app
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Conferir (typecheck e testes)
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Gerar o projeto Android (CNG)
        run: |
          # Diz no run se a chave chegou, sem mostrar a chave.
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::notice title=Google Maps::Chave configurada: o APK usa o Google Maps."
          else
            echo "::warning title=Google Maps::Sem o segredo GOOGLE_MAPS_API_KEY: o APK sai sem o mapa do Google."
          fi
          npx expo prebuild --platform android --no-install

      # arm64-v8a e armeabi-v7a: celulares. x86_64: emuladores (o teste abaixo e os de PC).
      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Nomear o APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "garupa-sp-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk app.apk

      # Confere dentro do APK que o app vai abrir o Google Maps (a 0.2.1 saiu com a chave no
      # Android, mas o JavaScript não sabia dela). Com chave e sem o mapa, o release não sai.
      - name: Conferir o Google Maps no APK
        run: |
          if unzip -p app.apk assets/app.config | grep -q '"mapaGoogle":true'; then
            echo "::notice title=Google Maps no APK::O app abre o Google Maps."
          elif [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error title=Google Maps no APK::Há chave, mas o APK saiu sem o Google Maps."
            exit 1
          else
            echo "::warning title=Google Maps no APK::Sem chave: as telas avisam que o mapa do Google não está ativado."
          fi

      # Só publica se o app abrir no emulador e continuar aberto (o 0.1.0 fechava na abertura).
      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/abrir-apk.sh

      - name: Guardar o log do emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-do-emulador
          path: |
            logcat.txt
            erro.txt
            instalar.txt
            tela.png
          if-no-files-found: ignore

      - name: Guardar o APK (push na main)
        if: github.ref_type != 'tag' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: apk-garupa-sp
          path: garupa-sp-${{ env.TAG }}.apk

      - name: Publicar no release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Garupa SP ${{ env.TAG }} (Android)
          body_path: .github/notas-do-release.md
          files: garupa-sp-${{ env.TAG }}.apk
          fail_on_unmatched_files: true
